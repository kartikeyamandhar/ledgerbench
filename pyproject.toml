[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ledgerbench"
dynamic = ["version"]
description = "A benchmark and CLI measuring whether analytics agents are business-correct, not merely execution-correct."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kartikeya Mandhar" }]
keywords = ["benchmark", "analytics", "llm", "agent", "sql", "dbt", "evaluation", "text-to-sql"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]
providers = [
    "anthropic>=0.39",
    "openai>=1.40",
]

[project.scripts]
ledgerbench = "ledgerbench.cli:app"

[project.urls]
Homepage = "https://github.com/kartikeyamandhar/ledgerbench"
Repository = "https://github.com/kartikeyamandhar/ledgerbench.git"
Issues = "https://github.com/kartikeyamandhar/ledgerbench/issues"

[tool.hatch.version]
path = "src/ledgerbench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerbench"]

[tool.hatch.build.targets.sdist]
include = ["src/ledgerbench", "README.md", "LICENSE", "CHANGELOG.md"]

# --- Ruff: lint + format ----------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["agentic_flow"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "D",    # pydocstyle
]
ignore = [
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__ method
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests do not need docstrings; mypy/style is relaxed on tests by policy.
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

# --- Mypy: strict on src ----------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "duckdb.*"
ignore_missing_imports = true

# --- Pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
]

# --- Coverage ---------------------------------------------------------------
# Phase 0 enforces only the 85% global gate; the 100% branch gates on
# scorer core (reconcile, actions, aggregate) and runner/safety.py are wired
# in their owning phases (2/4), once those modules contain logic. See ADR-0001.
[tool.coverage.run]
branch = true
source = ["ledgerbench"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
