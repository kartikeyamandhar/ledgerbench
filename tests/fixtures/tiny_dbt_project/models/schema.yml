# The declared semantics the LedgerBench generator consumes. The committed
# manifest.json was produced from this project and hand-trimmed; this file
# documents provenance.
version: 2

models:
  - name: customers
    columns:
      - name: customer_id
        data_type: integer
        tests: [unique, not_null]
      - name: region
        data_type: varchar

  - name: orders
    meta:
      ledgerbench:
        metrics:
          - id: revenue_net
            description: Net revenue from completed, non-refunded orders.
            measure: sum(amount)
            value_type: numeric
            filters: ["status = 'completed'"]
            exclusions: ["refunded = true"]
            time_column: order_ts
          - id: revenue_gross
            description: Gross revenue across all orders.
            measure: sum(amount)
            value_type: numeric
            time_column: order_ts
          - id: order_count
            description: Total number of orders.
            measure: count(*)
            value_type: count
      ledgerbench_project:
        reporting_timezone: America/New_York
        fiscal_year_start_month: 1
        absent_dimensions: [acquisition_channel]
        ambiguous_terms:
          - term: revenue
            readings: [revenue_gross, revenue_net]
    columns:
      - name: order_id
        data_type: integer
        tests: [unique, not_null]
      - name: customer_id
        data_type: integer
        tests:
          - relationships: {to: ref('customers'), field: customer_id}
      - name: order_ts
        data_type: timestamp
      - name: amount
        data_type: decimal(10,2)
      - name: status
        data_type: varchar
      - name: refunded
        data_type: boolean

  - name: order_items
    columns:
      - name: item_id
        data_type: integer
        tests: [unique, not_null]
      - name: order_id
        data_type: integer
        tests:
          - relationships: {to: ref('orders'), field: order_id}
      - name: quantity
        data_type: integer
