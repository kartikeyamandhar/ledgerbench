name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # CI invokes the tools directly (no project venv on the runner) but mirrors
      # exactly what `make check` runs locally: format check + lint + type + cov.
      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Tests + coverage gate
        run: pytest --cov=ledgerbench --cov-branch --cov-report=term-missing

      - name: Scorer-core 100% branch gate
        run: >
          pytest tests/unit tests/golden/scorer -q
          --cov=ledgerbench.scorer.reconcile --cov=ledgerbench.scorer.actions
          --cov=ledgerbench.scorer.aggregate --cov-branch --cov-fail-under=100
